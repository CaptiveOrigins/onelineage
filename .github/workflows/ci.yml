name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'terms/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'terms/**']
permissions:
  contents: read
# Actions minutes rules (ops/rules/actions-minutes.md, 2026-11-10): one run per change, drafts skipped, a timeout.
# The leak check runs in its own workflow (leak-check.yml) on every change, docs included.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
